<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0907" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0907'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-style='italic' text-anchor='middle' fill='%23e3a95c'%3EAT%3C/text%3E%3C/svg%3E" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Trần Thanh Anh Tú — Video Editor / Producer" />
  <meta property="og:description" content="Một hành trình 3D qua từng khung hình: dự án, showreel và câu chuyện của Anh Tú." />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Trần Thanh Anh Tú — Video Editor / Producer</title>
  <meta name="description" content="Portfolio của Trần Thanh Anh Tú, Video Editor / Producer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Màn hình chờ -->
  <div id="loader" aria-live="polite">
    <div class="loader-ink"><span></span><span></span><span></span></div>
    <div class="loader-center">
      <p class="loader-greeting" data-bind="intro.greeting"></p>
      <h1 class="loader-name" id="loaderName"></h1>
      <div class="loader-line"><i id="loaderBar"></i></div>
      <div class="loader-count"><span id="loaderCount">0</span>%</div>
      <button class="loader-enter" id="enterBtn" disabled>
        <span data-bind="intro.enterLabel">Bước vào</span>
        <svg viewBox="0 0 40 12" aria-hidden="true"><path d="M0 6h38M32 1l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
    <div class="loader-flare" aria-hidden="true"></div>
    <div class="shutter shutter-top"><span class="rec">● REC</span><span class="tc" id="timecode">00:00:00:00</span></div>
    <div class="shutter shutter-bottom"><span>AT® Film Studio</span><span>Cảnh 01 · Xưởng dựng</span></div>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#" class="brand" data-goto="0" data-bind="site.brand">AT®</a>
    <nav class="hexbar" id="hexbar" aria-label="Các chương"></nav>
    <span class="topbar-right" id="chapLabel"></span>
  </header>

  <div class="minimap" aria-hidden="true"><svg id="minimap" viewBox="0 0 100 100"></svg><span>Bản đồ xưởng</span></div>
  <div class="counter"><span id="chapNum">01</span><i></i><span id="chapTotal">08</span></div>
  <p class="hint" id="hint" data-bind="intro.hint"></p>

  <main id="chapters"></main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-body">
      <button class="modal-close" data-close aria-label="Đóng">×</button>
      <div class="modal-media" id="modalMedia"></div>
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </div>

  <div class="cursor" id="cursor"><span></span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
